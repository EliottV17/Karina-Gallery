<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Karina Gallery — Boceto de galería</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-design-page="gallery">
  <header class="site-header">
    <a class="brand" href="gallery.html">Karina Lauer</a>
    <span class="header-motto">Instantes de mi vida</span>
    <nav class="site-nav" aria-label="Navegación principal">
      <a class="current" href="gallery.html" aria-current="page">Galería</a>
      <a href="info.html">Info</a>
    </nav>
  </header>
  <main class="gallery-stage" aria-label="Boceto estático de la composición horizontal">
    <div class="photo-track">
      <figure class="photo-slot">
        <div class="photo-composition stack">
          <img src="../.pi/previews/karina-initial/01.jpg" alt="Embarcadero junto a un lago bajo un cielo azul">
          <img src="../.pi/previews/karina-initial/10.jpg" alt="Estación de alquiler de botes junto al lago">
          <img src="../.pi/previews/karina-initial/22.jpg" alt="Balaustrada con flores frente al lago y las montañas">
        </div>
        <figcaption class="photo-caption">Grupo provisional · 3 fotos</figcaption>
      </figure>
      <figure class="photo-slot">
        <div class="photo-composition single"><img src="../.pi/previews/karina-initial/09.jpg" alt="Lago que refleja montañas nevadas"></div>
        <figcaption class="photo-caption">Foto 09 · Paisajes</figcaption>
      </figure>
      <figure class="photo-slot">
        <div class="photo-composition stack">
          <img src="../.pi/previews/karina-initial/03.jpg" alt="Plaza con toldos de mercado frente a una fachada monumental">
          <img src="../.pi/previews/karina-initial/05.jpg" alt="Plaza de noche con un árbol iluminado">
          <img src="../.pi/previews/karina-initial/11.jpg" alt="Puente de piedra sobre un río y edificios en la ladera">
        </div>
        <figcaption class="photo-caption">Grupo provisional · 3 fotos</figcaption>
      </figure>
      <figure class="photo-slot">
        <div class="photo-composition single"><img src="../.pi/previews/karina-initial/06.jpg" alt="Atardecer dorado sobre aguas tranquilas"></div>
        <figcaption class="photo-caption">Foto 06 · Paisajes</figcaption>
      </figure>
      <figure class="photo-slot">
        <div class="photo-composition stack">
          <img src="../.pi/previews/karina-initial/02.jpg" alt="Carretera nevada entre árboles y niebla">
          <img src="../.pi/previews/karina-initial/07.jpg" alt="Orilla nevada frente a una montaña iluminada">
          <img src="../.pi/previews/karina-initial/16.jpg" alt="Valle montañoso y edificio entre árboles otoñales">
        </div>
        <figcaption class="photo-caption">Grupo provisional · 3 fotos</figcaption>
      </figure>
      <figure class="photo-slot">
        <div class="photo-composition single"><img src="../.pi/previews/karina-initial/24.jpg" alt="Estructura de madera sobre aguas turquesas"></div>
        <figcaption class="photo-caption">Foto 24 · Arquitectura</figcaption>
      </figure>
      <figure class="photo-slot">
        <div class="photo-composition stack">
          <img src="../.pi/previews/karina-initial/04.jpg" alt="Mesa al aire libre con una bandeja de desayuno">
          <img src="../.pi/previews/karina-initial/12.jpg" alt="Piscina y jardín rodeados de montañas">
          <img src="../.pi/previews/karina-initial/15.jpg" alt="Flores y jardines junto a edificios de ladrillo">
        </div>
        <figcaption class="photo-caption">Grupo provisional · 3 fotos</figcaption>
      </figure>
      <figure class="photo-slot">
        <div class="photo-composition single"><img src="../.pi/previews/karina-initial/14.jpg" alt="Edificios altos por encima de la vegetación al anochecer"></div>
        <figcaption class="photo-caption">Foto 14 · Arquitectura</figcaption>
      </figure>
      <figure class="photo-slot">
        <div class="photo-composition stack">
          <img src="../.pi/previews/karina-initial/17.jpg" alt="Paseo con flores frente a un lago y montañas">
          <img src="../.pi/previews/karina-initial/19.jpg" alt="Camino junto a un lago hacia un pueblo entre montañas">
          <img src="../.pi/previews/karina-initial/23.jpg" alt="Playa de piedras con palmeras junto al lago">
        </div>
        <figcaption class="photo-caption">Grupo provisional · 3 fotos</figcaption>
      </figure>
      <figure class="photo-slot">
        <div class="photo-composition single"><img src="../.pi/previews/karina-initial/08.jpg" alt="Muro de una presa rodeado de bosque"></div>
        <figcaption class="photo-caption">Foto 08 · Arquitectura</figcaption>
      </figure>
      <figure class="photo-slot">
        <div class="photo-composition stack">
          <img src="../.pi/previews/karina-initial/18.jpg" alt="Vacas descansando en una pradera verde">
          <img src="../.pi/previews/karina-initial/20.jpg" alt="Parque soleado en la orilla de un lago">
          <img src="../.pi/previews/karina-initial/21.jpg" alt="Personas practicando paddle surf frente a un pueblo ribereño">
        </div>
        <figcaption class="photo-caption">Grupo provisional · 3 fotos</figcaption>
      </figure>
      <figure class="photo-slot">
        <div class="photo-composition single"><img src="../.pi/previews/karina-initial/13.jpg" alt="Vista elevada de tejados y un valle desde unas ruinas de piedra"></div>
        <figcaption class="photo-caption">Foto 13 · Arquitectura</figcaption>
      </figure>
      <figure class="photo-slot">
        <div class="photo-composition single"><img src="../.pi/previews/karina-initial/25.jpg" alt="Escalones de un puerto que descienden hacia el agua"></div>
        <figcaption class="photo-caption">Foto 25 · Paisajes</figcaption>
      </figure>
    </div>
  </main>
  <footer class="gallery-footer">
    <span class="footer-label">25 fotografías</span>
    <div class="filters" aria-label="Representación estática de los filtros">
      <span class="filter active">Todas</span>
      <span class="filter">Paisajes</span>
      <span class="filter">Arquitectura</span>
      <span class="filter">Momentos</span>
    </div>
    <span class="scroll-hint">Desplázate para explorar →</span>
  </footer>
  <output id="design-check" hidden></output>
  <script src="layout.js"></script>
  <script src="check.js"></script>
</body>
</html>
